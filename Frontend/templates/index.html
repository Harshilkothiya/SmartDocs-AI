<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDoc-AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* Custom scrollbar */
    #chat-container::-webkit-scrollbar { width: 6px; }
    #chat-container::-webkit-scrollbar-track { background: #2d3748; }
    #chat-container::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }
    #chat-container::-webkit-scrollbar-thumb:hover { background: #718096; }

    /* --- BEAUTIFUL CHAT STYLES --- */
    /* This makes the lists, bold text, and headers look professional */
    .markdown-content ul {
        list-style-type: disc;
        margin-left: 20px;
        margin-bottom: 8px;
    }
    .markdown-content ol {
        list-style-type: decimal;
        margin-left: 20px;
        margin-bottom: 8px;
    }
    .markdown-content h2 {
        font-size: 1.1rem;
        font-weight: bold;
        margin-top: 10px;
        margin-bottom: 5px;
        color: #e2e8f0;
        border-bottom: 1px solid #4a5568;
        padding-bottom: 2px;
    }
    .markdown-content h3 {
        font-weight: bold;
        margin-top: 8px;
        color: #cbd5e0;
    }
    .markdown-content strong {
        color: #63b3ed; /* Light blue for importance */
        font-weight: 700;
    }
    .markdown-content p {
        margin-bottom: 8px;
    }
  </style>
</head>

<body class="bg-gray-900 text-white font-sans flex flex-col h-screen">

  <header class="bg-gray-800 shadow-md p-4 flex items-center justify-between flex-shrink-0 z-10">
    <div class="flex items-center space-x-3">
      <i class="fas fa-file-pdf text-red-500 text-2xl"></i>
      <h1 class="text-xl font-bold">SmartDoc-AI</h1>
    </div>
    <div class="flex items-center space-x-2">
      <span class="text-xs text-green-400">●</span>
      <span class="text-sm text-gray-400">Online</span>
    </div>
  </header>

  <main id="chat-container" class="flex-1 p-6 overflow-y-auto">
    <div id="message-list" class="space-y-6">
      <div class="flex items-start gap-3">
        <div class="bg-gray-700 p-2 rounded-full flex-shrink-0">
          <i class="fas fa-robot text-white"></i>
        </div>
        <div class="bg-gray-700 p-4 rounded-lg rounded-tl-none max-w-lg shadow-lg">
          <p class="text-sm">Hello! I'm your PDF AI Agent. How can I help you with your documents today?</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-gray-800 p-4 flex-shrink-0">
    <form id="chat-form" class="flex items-center space-x-4">
      <label for="file-upload" class="cursor-pointer">
        <i class="fas fa-paperclip text-gray-400 hover:text-blue-500 transition-colors duration-200 text-lg"></i>
        <input id="file-upload" type="file" class="hidden">
      </label>
      <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off"
        class="flex-1 bg-gray-700 border border-gray-600 rounded-full py-3 px-5 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm text-white">
      <button type="submit"
        class="bg-blue-600 text-white rounded-full p-3 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200">
        <i class="fas fa-paper-plane"></i>
      </button>
    </form>
  </footer>

  <script>
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const messageList = document.getElementById('message-list');
    const chatContainer = document.getElementById('chat-container');

    // --- Form Submission ---
    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const messageText = messageInput.value.trim();

      if (messageText) {
        addMessage('user', messageText);
        messageInput.value = '';
        scrollToBottom();

        // Call AI Response
        aiResponse(messageText); 
      }
    });

    /**
     * Appends a new message.
     * Uses marked.parse() for AI messages to render Bold/Lists/Headers.
     */
    function addMessage(sender, text) {
      const messageWrapper = document.createElement('div');
      let innerContent = '';

      if (sender === 'user') {
        // User Message (Plain Text)
        messageWrapper.className = 'flex items-start gap-3 justify-end';
        innerContent = `
          <div class="bg-blue-600 p-4 rounded-lg rounded-br-none max-w-lg shadow-lg text-white">
            <p class="text-sm">${text}</p>
          </div>
          <div class="bg-blue-600 p-2 rounded-full flex-shrink-0">
            <i class="fas fa-user text-white"></i>
          </div>
        `;
      } else {
        // AI Message (Formatted HTML)
        // 1. Convert Markdown to HTML using marked.parse()
        const formattedText = marked.parse(text);

        messageWrapper.className = 'flex items-start gap-3';
        innerContent = `
          <div class="bg-gray-700 p-2 rounded-full flex-shrink-0">
            <i class="fas fa-robot text-white"></i>
          </div>
          <div class="bg-gray-700 p-4 rounded-lg rounded-tl-none max-w-lg shadow-lg text-sm markdown-content">
            ${formattedText}
          </div>
        `;
      }

      messageWrapper.innerHTML = innerContent;
      messageList.appendChild(messageWrapper);
      scrollToBottom();
    }

    /**
     * Fetches response from Python Backend
     */
    async function aiResponse(userInput) {
      // 1. Show temporary thinking message
      const thinkingWrapper = document.createElement('div');
      thinkingWrapper.className = 'flex items-start gap-3';
      thinkingWrapper.innerHTML = `
         <div class="bg-gray-700 p-2 rounded-full flex-shrink-0"><i class="fas fa-robot text-white"></i></div>
         <div class="bg-gray-700 p-4 rounded-lg rounded-tl-none max-w-lg shadow-lg"><p class="text-sm italic text-gray-400">Thinking...</p></div>
      `;
      messageList.appendChild(thinkingWrapper);
      scrollToBottom();

      try {
        const response = await fetch("/aiagent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userInput }),
        });

        if (!response.ok) throw new Error("Network response was not ok");

        const data = await response.json();
        const aiText = data.output || data.reply || "No response received.";

        // 2. Remove thinking message
        messageList.removeChild(thinkingWrapper);

        // 3. Add actual formatted response
        addMessage("ai", aiText);

      } catch (error) {
        console.error("Error:", error);
        messageList.removeChild(thinkingWrapper);
        addMessage("ai", "Sorry, I seem to be having trouble connecting.");
      }
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // --- File Upload ---
    const fileUpload = document.getElementById('file-upload');
    fileUpload.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (file) {
        addMessage('user', `Attached file: ${file.name}`);
        
        // Show temporary uploading message
        const uploadMsg = document.createElement('div');
        uploadMsg.className = 'flex items-start gap-3';
        uploadMsg.innerHTML = `<div class="bg-gray-700 p-4 rounded-lg"><p class="text-sm italic">Uploading...</p></div>`;
        messageList.appendChild(uploadMsg);
        
        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch("/upload", { method: "POST", body: formData });
          const data = await res.json();
          
          messageList.removeChild(uploadMsg); // Remove loading msg

          if (data.message) {
            addMessage('ai', `**Success!** ${data.message} \n\nYou can now ask questions about *${file.name}*.`);
          } else {
            addMessage('ai', `**Error:** ${data.error}`);
          }
        } catch (err) {
            messageList.removeChild(uploadMsg);
            addMessage('ai', "Failed to upload file. Please try again.");
        }
      }
    });
  </script>
</body>
</html>
